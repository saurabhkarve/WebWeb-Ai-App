# Codemagic CI: builds the Android App Bundle and the iOS app from this repo.
# Setup (one time, in the Codemagic UI) is described in CODEMAGIC.md.
#
# Environment variable groups used here:
#   firebase      GOOGLE_SERVICES_JSON (base64 of google-services.json, Android app ai.webweb.app)
#                 GOOGLE_SERVICE_INFO_PLIST (base64 of GoogleService-Info.plist, iOS app ai.webweb.app)
#   app_store     APP_STORE_APPLE_ID (the numeric Apple ID of the app in App Store Connect)
# Code signing identities: Android keystore reference "webweb_upload"; iOS uses the
# App Store Connect API key integration "WebWeb ASC" (automatic signing).
#
# One Codemagic account builds this app: the one whose "firebase" group holds the files of the Firebase
# project below (webweb-ai-app). Any other account that has this repo added stops at the first step with
# a clear error instead of shipping an app wired to the wrong Firebase (no push, no phone login).
#
# Versions: tag the commit v<version>, e.g. v0.2.0. The tag becomes the version name the stores and the
# in-app update prompt (Admin > App updates) compare; the build number counts up on its own.

definitions:
  env: &env
    flutter: stable
    java: 17
    vars: &vars
      API_URL: https://biznetapi.webweb.ai
      # the only Firebase project this app may be built with (see the header)
      FIREBASE_PROJECT: webweb-ai-app
      FIREBASE_PROJECT_NUMBER: "441974581550"
  email: &email
    email:
      recipients:
        - saurabh@skyq.in
      notify:
        success: true
        failure: true

workflows:
  android-release:
    name: Android release (AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env
      groups:
        - firebase
      android_signing:
        - webweb_upload
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Firebase config
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is not set. Add it in App > Environment variables, group 'firebase'."; exit 1
          fi
          # accept the file pasted either base64-encoded or as plain JSON
          if echo "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" | tr -d ' \n\r' | base64 --decode > android/app/google-services.json || { echo "ERROR: GOOGLE_SERVICES_JSON is not valid base64"; exit 1; }
          fi
          python3 - <<'PY'
          import json, os, sys
          try:
              d = json.load(open("android/app/google-services.json"))
          except Exception as e:
              sys.exit(f"ERROR: google-services.json is not valid JSON ({e})")
          ids = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
          info = d.get("project_info", {})
          print("google-services.json project:", info.get("project_id"), info.get("project_number"), "apps:", ids)
          want = os.environ["FIREBASE_PROJECT"]
          if info.get("project_id") != want or str(info.get("project_number")) != os.environ["FIREBASE_PROJECT_NUMBER"]:
              sys.exit(f"ERROR: this Codemagic account's google-services.json is for Firebase project '{info.get('project_id')}', "
                       f"but this app must be built with '{want}'. Build from the account that owns that project, "
                       "or replace GOOGLE_SERVICES_JSON in the 'firebase' group with that project's file.")
          if "ai.webweb.app" not in ids:
              sys.exit("ERROR: no Android app 'ai.webweb.app' in google-services.json. In Firebase add an Android app with package ai.webweb.app and download the file again.")
          PY
      - name: Signing config (key.properties from the Codemagic keystore)
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Version from the tag
        script: |
          # v0.2.0 -> 0.2.0; builds started without a tag keep the version in pubspec.yaml
          NAME="${CM_TAG#v}"
          [ -z "$CM_TAG" ] && NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          echo "BUILD_NAME=$NAME" >> $CM_ENV
          echo "Version $NAME"
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-name=$BUILD_NAME \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=API_URL=$API_URL
      - name: Build APK (for direct install / testing)
        script: |
          flutter build apk --release \
            --build-name=$BUILD_NAME \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=API_URL=$API_URL
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      <<: *email
      # Uncomment after the first manual upload to Play Console and adding the service account JSON
      # (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS) to the "firebase" group or a "play" group:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: WebWeb ASC
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
      groups:
        - firebase
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ai.webweb.app
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      # first, so a build from the wrong Codemagic account stops before signing anything
      - name: Firebase config (values passed to the app as --dart-define)
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST is not set. Add it in App > Environment variables, group 'firebase'."; exit 1
          fi
          if echo "$GOOGLE_SERVICE_INFO_PLIST" | grep -q '<plist'; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > /tmp/gsi.plist
          else
            echo "$GOOGLE_SERVICE_INFO_PLIST" | tr -d ' \n\r' | base64 --decode > /tmp/gsi.plist
          fi
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" /tmp/gsi.plist; }
          echo "FIREBASE_IOS_API_KEY=$(pb API_KEY)" >> $CM_ENV
          echo "FIREBASE_IOS_APP_ID=$(pb GOOGLE_APP_ID)" >> $CM_ENV
          echo "FIREBASE_SENDER_ID=$(pb GCM_SENDER_ID)" >> $CM_ENV
          echo "FIREBASE_PROJECT_ID=$(pb PROJECT_ID)" >> $CM_ENV
          echo "GoogleService-Info.plist project: $(pb PROJECT_ID) $(pb GCM_SENDER_ID) bundle: $(pb BUNDLE_ID)"
          if [ "$(pb PROJECT_ID)" != "$FIREBASE_PROJECT" ] || [ "$(pb GCM_SENDER_ID)" != "$FIREBASE_PROJECT_NUMBER" ]; then
            echo "ERROR: this Codemagic account's GoogleService-Info.plist is for Firebase project '$(pb PROJECT_ID)', but this app must be built with '$FIREBASE_PROJECT'."
            echo "Build from the account that owns that project, or replace GOOGLE_SERVICE_INFO_PLIST in the 'firebase' group with that project's file."
            exit 1
          fi
          test "$(pb BUNDLE_ID)" = "ai.webweb.app" || { echo "GoogleService-Info.plist is for $(pb BUNDLE_ID), expected ai.webweb.app"; exit 1; }
      - name: Dependencies
        script: flutter pub get
      # (flutter build ipa runs CocoaPods itself for plugins that are not Swift packages)
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Version from the tag
        script: |
          NAME="${CM_TAG#v}"
          [ -z "$CM_TAG" ] && NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          echo "BUILD_NAME=$NAME" >> $CM_ENV
          echo "Version $NAME"
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_URL=$API_URL \
            --dart-define=FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY \
            --dart-define=FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID \
            --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID \
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      <<: *email
      app_store_connect:
        auth: integration
        submit_to_testflight: true
