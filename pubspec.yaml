name: webweb_app
description: WebWeb AI - business network app for Android and iOS (same API as the web).
publish_to: "none"
version: 0.1.88+88

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^3.1.6
  flutter_contacts: ^2.6.0
  flutter_local_notifications: ^22.3.2
  flutter_ringtone_player: ^4.0.0+4
  flutter_svg: ^2.3.0
  flutter_webrtc: ^1.6.2+hotfix.4
  geolocator: ^14.0.1
  http: ^1.2.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # 12.x: 13.x pulls permission_handler_android 14.1, built against Android 37, which Codemagic cannot resolve yet
  permission_handler: ^12.0.1
  provider: ^6.1.2
  qr: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.svg
    - assets/i18n/
  fonts:
    - family: Akash
      fonts:
        - asset: assets/fonts/Akash-300.ttf
          weight: 300
        - asset: assets/fonts/Akash-500.ttf
          weight: 500
        - asset: assets/fonts/Akash-700.ttf
          weight: 700

# Smart Phonebook icon: the logo gradient as the square, a white circle, the W in the same gradient
# ("\" strokes and dot bright, "/" strokes light). Android adaptive: gradient background + circle and W inside the safe zone.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  image_path_ios: assets/icon_ios.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon_bg.png
  adaptive_icon_foreground: assets/icon_fg.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/icon.png



